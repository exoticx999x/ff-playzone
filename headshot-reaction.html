<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Headshot Reaction Test — FF PlayZone</title>
<link rel="stylesheet" href="../style.css">
<style>
  #arena {
    position: relative;
    width: 100%;
    height: 68vh;
    min-height: 420px;
    background: #0d1117;
    border: 2px solid #ff6b1a;
    border-radius: 16px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #target {
    display: none;
    position: absolute;
    width: 68px; height: 68px;
    margin: -34px 0 0 -34px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff3b3b 28%, #ff6b1a 62%, #ffd23f 100%);
    cursor: pointer;
    box-shadow: 0 0 26px #ff3b3b;
    z-index: 2;
  }
</style>
</head>
<body>
<a class="back" href="../index.html">← Back to games</a>
<div class="game-wrap">
  <div id="message">Tap START when ready!</div>
  <div id="arena">
    <div id="startScreen" class="overlay-screen">
      <h2>🎯 Headshot Reaction Test</h2>
      <p>10 targets will pop up at random spots. Tap each one as FAST as you can. Your average reaction time decides your rank!</p>
      <button id="startBtn" class="big-btn">START</button>
    </div>
    <div id="endScreen" class="overlay-screen" style="display:none">
      <h2>Done!</h2>
      <p id="result"></p>
      <p id="rank"></p>
      <button id="againBtn" class="big-btn">PLAY AGAIN</button>
    </div>
    <div id="target"></div>
  </div>
</div>
<script src="headshot.js"></script>
</body>
</html>
